name: app_doctor
description: "A core bluetooth connection for Back Belt Project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  equatable: ^2.0.7
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  riverpod_generator: ^3.0.3
  riverpod_lint: ^3.0.3
  riverpod: ^3.0.3
  http: ^1.5.0
  rxdart: ^0.28.0
  url_launcher: ^6.3.2
  flutter_native_splash: ^2.4.4
  flutter_svg: ^2.2.1
  go_router: ^17.0.1
  dio: ^5.9.0
  flutter_dotenv: ^6.0.0
  fl_chart: ^1.1.1
  json_serializable: ^6.11.2
  json_annotation: ^4.9.0
  pretty_dio_logger: ^1.4.0
  build_runner: ^2.10.5
  intl: ^0.20.2
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1
  flutter_launcher_icons: ^0.14.4
  web_socket_channel: ^3.0.3
  timezone: ^0.10.1
  flutter_timezone: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter_launcher_icons:
  image_path: "assets/images/icon/icon.png"
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - .env
    - app.env
    - assets/images/icon/icon.png
    - assets/images/icon/Group 241.png
    - assets/images/icon/Painsense Belt.817 1.png
    - assets/images/icon/exercises/
    - assets/images/logo/ps_logo_full.png
    - assets/images/logo/ps_logo_full_white.png
    - assets/images/logo/logo_full_color.jpg
    - assets/images/logo/logo_full_color_no_bg.png
    - assets/images/logo/ps_logo.jpg
    - assets/images/avatar/avatar.png
    - assets/images/avatar/Cameron Taylor.png
    - assets/images/avatar/Simone Green.png
    - assets/images/avatar/Sarah Morgan.png

  fonts:
    - family: Cabin
      fonts:
        - asset: assets/fonts/Cabin/static/Cabin-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cabin/static/Cabin-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Cabin/static/Cabin-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cabin/static/Cabin-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Cabin/static/Cabin-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cabin/static/Cabin-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Cabin/static/Cabin-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cabin/static/Cabin-BoldItalic.ttf
          weight: 700
          style: italic
