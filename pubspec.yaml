name: app_doctor
description: "A core bluetooth connection for Back Belt Project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  equatable: ^2.0.7
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  riverpod_generator: ^3.0.3
  riverpod_lint: ^3.0.3
  riverpod: ^3.0.3
  http: ^1.5.0
  rxdart: ^0.28.0
  url_launcher: ^6.3.2
  flutter_native_splash: ^2.4.4
  go_router: ^17.0.1
  dio: ^5.9.0
  flutter_dotenv: ^6.0.0
  fl_chart: ^1.1.1
  json_serializable: ^6.11.2
  json_annotation: ^4.9.0
  pretty_dio_logger: ^1.4.0
  build_runner: ^2.10.5
  intl: ^0.20.2
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1
  flutter_launcher_icons: ^0.14.4
  web_socket_channel: ^3.0.3
  timezone: ^0.10.1
  flutter_timezone: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter_launcher_icons:
  image_path: "assets/images/icon/icon.png"
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/icon/icon.png
    - assets/images/logo/ps_logo_full.png
    - assets/images/logo/ps_logo.jpg
